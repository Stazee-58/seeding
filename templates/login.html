{% extends "base.html" %}

{% block title %}Đăng nhập — FB Tracking No-API Pro{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 50px auto;">

  <div class="card">
    <div class="card-header">
      <div class="card-title">
        <i class="fa-solid fa-right-to-bracket" style="color: var(--primary);"></i>
        <span>Đăng Nhập Hệ Thống</span>
      </div>
    </div>

    {% if error %}
      <div class="alert alert-danger">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>{{ error }}</span>
      </div>
    {% endif %}

    <form action="/login" method="POST">
      <div class="form-group">
        <label class="form-label">Email đăng nhập</label>
        <input type="email" name="email" class="form-input" placeholder="name@example.com" required value="{{ email or '' }}">
      </div>

      <div class="form-group">
        <label class="form-label">Mật khẩu</label>
        <input type="password" name="password" class="form-input" placeholder="Nhập mật khẩu" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">
        <i class="fa-solid fa-arrow-right-to-bracket"></i> Đăng Nhập
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border-subtle); font-size: 0.88rem; color: var(--text-secondary);">
      Chưa có tài khoản? <a href="/register" style="font-weight: 600;">Đăng ký miễn phí</a>
    </div>

    <!-- Hotline hỗ trợ -->
    <div style="margin-top: 16px; text-align: center; background: rgba(245, 158, 11, 0.08); padding: 12px; border-radius: var(--radius-sm); border: 1px dashed rgba(245, 158, 11, 0.3);">
      <span style="font-size: 0.85rem; color: #fbbf24;">
        <i class="fa-solid fa-phone"></i> Liên hệ để kích hoạt tài khoản: <strong>0984113158</strong>
      </span>
    </div>

  </div>
</div>
{% endblock %}
